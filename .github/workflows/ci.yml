name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Tipos
        run: uv run mypy
      - name: Testes
        run: uv run pytest
