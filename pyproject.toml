[project]
name = "prodata"
version = "0.2.2"
description = "Plataforma visual de pipelines de dados (ETL colunar, BI e AutoML) sobre Polars, DuckDB e Apache Arrow."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "connectorx>=0.4.6",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "fastexcel>=0.21.0",
    "keyring>=25.7.0",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
prodata = "prodata.__main__:main"
prodata-desktop = "prodata.desktop:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
]

[dependency-groups]
build = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos em strings/comentários em PT-BR
    "E501",    # o formatter cuida do comprimento; strings longas de UI ficam inteiras
    "B008",    # File()/Form() em defaults é o idioma do FastAPI
    "N806",    # X, X_tr... é a convenção de ML
    "PTH105",  # os.replace é a troca atômica explícita
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
